app-id: com.nightbreedlabs.BeatsControl
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: beats-control
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --system-talk-name=org.bluez
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.mpris.MediaPlayer2.*
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pipewire/*.conf.avail
modules:
  - name: pipewire-filter-chain
    buildsystem: meson
    config-opts:
      - --auto-features=disabled
      - -Dsession-managers=[]
      - -Dspa-plugins=enabled
      - -Dsupport=enabled
      - -Daudioconvert=enabled
      - -Dcontrol=enabled
      - -Dudev=disabled
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.6.8/pipewire-1.6.8.tar.gz
        sha256: 8181172a1d95131f6af8bbc0b98f90b2a33349b042b84c3ce57dd5d11348cc58
  - name: beats-control
    buildsystem: simple
    build-commands:
      - ./install-files.sh /app
    sources:
      - type: dir
        path: .
